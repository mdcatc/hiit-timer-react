<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interval Timer</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background-color: #222;
      color: #fff;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 2rem;
    }

    input, textarea, button {
      font-size: 1.2rem;
      padding: 0.5rem;
      margin: 0.3rem;
    }

    #timerDisplay {
      font-size: 6rem;
      margin-top: 2rem;
    }

    #phaseLabel {
      font-size: 2rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interval Timer</h1>

    <div>
      <label>Routine (e.g. <code>((w20,w20,w20,r60)3x)3x</code>):</label><br/>
      <textarea id="routineInput" rows="10" style="width:100%;resize:vertical;">## Warm-Up
- Jumping Jacks: 15s
- High Knees: 15s
- Rest: 15s

## Main Set (Repeat 3x)
- Push-Ups: 10s
- Squats: 10s
- Lunges: 10s
- Rest: 15s

## Cool Down
- Stretch: 15s</textarea>
    </div>

    <div>
      <button onclick="startTimer()">Start</button>
      <button onclick="stopTimer()">Stop</button>
      <button onclick="resetTimer()">Reset</button>
    </div>

    <div id="timerDisplay">00:00</div>
    <div id="phaseLabel">Idle</div>
  </div>

  <script>
    let timer = null;
    let currentIndex = 0;
    let routinePhases = [];

    
    function parseRoutine(input) {
      return parseMarkdownWorkout(input);
    }

    function startTimer() {
      if (timer) return;

      const input = document.getElementById('routineInput').value;
      routinePhases = parseRoutine(input);
      currentIndex = 0;
      runPhase();
    }

    function runPhase() {
      if (currentIndex >= routinePhases.length) {
        updateDisplay("00:00", "Complete", "#444");
        return;
      }

      const { type, duration } = routinePhases[currentIndex];
      let timeLeft = duration;
      //updateDisplay(formatTime(timeLeft), type.toUpperCase(), getPhaseColor(type, timeLeft));
      updateDisplay(formatTime(timeLeft), routinePhases[currentIndex].label, getPhaseColor(routinePhases[currentIndex].label.toLowerCase(), timeLeft));

      timer = setInterval(() => {
        timeLeft--;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timer = null;
          currentIndex++;
          runPhase();
        } else {
            updateDisplay(formatTime(timeLeft), routinePhases[currentIndex].label, getPhaseColor(routinePhases[currentIndex].label.toLowerCase(), timeLeft));
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function resetTimer() {
      stopTimer();
      updateDisplay("00:00", "Idle", "#222");
    }

    function updateDisplay(time, label, bgColor) {
      document.getElementById('timerDisplay').textContent = time;
      document.getElementById('phaseLabel').textContent = label;
      document.body.style.backgroundColor = bgColor;
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function getPhaseColor(label, timeLeft) {
      const lower = (label || '').toLowerCase();
      if (lower.startsWith('rest')) return '#007bff'; // blue for rest phases
      if (timeLeft <= 3) return '#ff0000';   // red in last 3 sec
      if (timeLeft <= 5) return '#ffc107';  // yellow
      return '#28a745';                      // green for work phases
    }

    function parseMarkdownWorkout(mdText) {
        const lines = mdText.split('\n').map(l => l.trim()).filter(l => l);
        const routine = [];
        let currentBlock = [];
        let repeatCount = 1;
        let inRepeatBlock = false;

        for (let line of lines) {
            // Section header
            const sectionHeader = line.match(/^##\s+(.*?)(?:\s+\(Repeat\s+(\d+)x\))?$/i);
            if (sectionHeader) {
                // Flush the previous block before starting a new section
                if (currentBlock.length > 0) {
                    if (inRepeatBlock) {
                        routine.push({ repeat: repeatCount, block: currentBlock });
                    } else {
                        routine.push(...currentBlock);
                    }
                    currentBlock = [];
                    repeatCount = 1;
                }

                inRepeatBlock = !!sectionHeader[2];
                repeatCount = inRepeatBlock ? parseInt(sectionHeader[2], 10) : 1;
                continue;
            }

            // Exercise line
            const exerciseMatch = line.match(/^-?\s*(.+?):\s*(\d+)s$/i);
            if (exerciseMatch) {
                const label = exerciseMatch[1].trim();
                const duration = parseInt(exerciseMatch[2]);
                currentBlock.push({ label, duration });
            }
        }

        // Push last block
        if (currentBlock.length > 0) {
            if (inRepeatBlock) {
            routine.push({ repeat: repeatCount, block: currentBlock });
            } else {
            routine.push(...currentBlock);
            }
        }

        // Flatten repeat blocks
        const flattened = [];
        for (const item of routine) {
            if (item.repeat) {
            for (let i = 1; i <= item.repeat; i++) {
                for (const step of item.block) {
                flattened.push({
                    ...step,
                    label: `${step.label} (${i}/${item.repeat})`
                });
                }
            }
            } else {
            flattened.push(item);
            }
        }

        console.log('Flattened routine:', flattened);
        return flattened;
    }

  </script>
</body>
</html>
